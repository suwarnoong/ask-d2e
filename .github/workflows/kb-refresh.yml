name: KB Refresh

on:
  schedule:
    # Run one time each day. The job calls isDue() to apply the cadence of each repo.
    # Do not add more cron schedules for the different cadence values.
    - cron: "0 23 * * *"
  workflow_dispatch:
    # A manual trigger for tests. It needs no inputs for each repo. It calls isDue() again
    # for the entries that are in the registry.
    inputs:
      dry_run:
        description: "Dry run"
        required: false
        default: "false"
      force:
        description: "Force refresh, ignoring set cadence value"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: kb-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ask-d2e
        uses: actions/checkout@v4

      - name: Checkout ask-d2e-kb
        uses: actions/checkout@v4
        with:
          repository: suwarnoong/ask-d2e-kb
          token: ${{ secrets.KB_REPO_TOKEN }}
          path: kb

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code

      # There is no checkout step for the source repos. The job knows which repos to clone
      # only after it reads repos.json and calls isDue(). Thus refresh.ts clones them.
      - name: Run refresh
        run: npm run kb-refresh
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KB_REPO_TOKEN: ${{ secrets.KB_REPO_TOKEN }}
          SOURCE_REPOS_TOKEN: ${{ secrets.SOURCE_REPOS_TOKEN }}
          KB_ROOT: ${{ github.workspace }}/kb
          WORK_DIR: ${{ github.workspace }}/src-checkout
          KB_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          # On a schedule run, `inputs` is null. The value is then always 'false'.
          # The cron thus cannot force a refresh.
          FORCE_REFRESH: ${{ inputs.force || 'false' }}
          CLAUDE_TIMEOUT_MS: "600000"
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          SLACK_WEBHOOK_URLS: ${{ secrets.SLACK_WEBHOOK_URLS }}
